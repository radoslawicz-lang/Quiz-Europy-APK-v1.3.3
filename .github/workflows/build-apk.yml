name: Zbuduj APK
on: { workflow_dispatch: {}, push: { branches: [main, master] } }
permissions: { contents: read }
jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 20
  steps:
   - uses: actions/checkout@v6
   - uses: actions/setup-java@v5
     with: { distribution: temurin, java-version: '17' }
   - name: Android SDK
     run: |
      echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
      yes | "$SDKMANAGER" --licenses >/dev/null || true
      "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
   - uses: gradle/actions/setup-gradle@v6
     with: { gradle-version: '8.10.2' }
   - name: Build APK
     run: |
      gradle --no-daemon clean assembleDebug
      cp app/build/outputs/apk/debug/app-debug.apk Quiz-Europy-v1.3.3.apk
   - uses: actions/upload-artifact@v4
     with: { name: Quiz-Europy-APK-v1.3.3, path: Quiz-Europy-v1.3.3.apk, if-no-files-found: error }
